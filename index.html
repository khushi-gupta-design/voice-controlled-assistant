<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voice Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="introScreen" class="purple-screen">
    <div class="mic-icon">🎙️</div>
    <h1 id="typedText"></h1>
    <p class="tagline">Speak. Ask. Discover.</p>
  </div>

  <div id="mainScreen" class="black-screen" style="display: none;">
  <div class="card">
    <p>Ask your question</p>
    <input type="text" id="textInput" placeholder="Type your question..." />
    <button id="askBtn">Ask</button>
    <button id="voiceBtn">🎤 Speak</button>
    <p id="response"></p>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
